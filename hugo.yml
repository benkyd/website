baseURL: "https://benkyd.co.uk/"
languageCode: "en-GB"
title: "Ben Kyd"
theme: "PaperMod"
defaultContentLanguage: "en"
enableRobotsTXT: true
fonts: [ "Libron" ] # self-hosted, see assets/css/extended/custom_fonts.css
fontbody: "Libron"
googleAnalytics: "G-J2M8RXRC9P"

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  mainSections: ["posts"]
  description: "Blog"
  author: Ben Kyd

  defaultTheme: light
  ShowShareButtons: true
  ShowReadingTime: true
  disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  math: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  assets:
    theme_color: "#faf9f6"
  ShareButtons: ["linkedin", "twitter"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Ben Kyd"
    Content: >
      GPU Kernel Driver Software Engineer / Amateur Photographer

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/BenKyd"
    - name: YouTube
      title: YouTube
      url: "https://youtube.com/@benkyd7874"
    - name: linkedin
      title: LinkedIn
      url: "https://uk.linkedin.com/in/ben-kyd-954269173"
    - name: instagram
      title: Instagram
      url: "https://instagram.com/ben_kyd"
menu:
  main:
    - identifier: "home"
      name: "Home"
      url: "/"
      weight: 1
    - identifier: "photography"
      name: "Photography"
      url: "/photography/"
      weight: 2
    - identifier: "blog"
      name: "Blog"
      url: "/posts/"
      weight: 3
    - identifier: "about"
      name: "About Me"
      url: "/about/"
      weight: 4

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true


